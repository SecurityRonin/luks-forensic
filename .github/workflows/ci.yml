name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · per-line coverage gate.
  #
  # Every default fits this repo, so there is nothing to override: MSRV is
  # derived from rust-version (1.81), coverage is already the per-line gate at
  # --workspace --all-features, and core/fuzz is discovered automatically.
  ci:
    uses: SecurityRonin/fleet-config/.github/workflows/rust-ci.yml@5bfd1026c31e82b6c0b192a091c82dc1a7e7ee39

  # Repo-specific, so it stays here rather than moving into the shared workflow.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
