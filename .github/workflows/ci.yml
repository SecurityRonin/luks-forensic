name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · per-line coverage gate.
  #
  # Every default fits this repo, so there is nothing to override: MSRV is
  # derived from rust-version (1.81), coverage is already the per-line gate at
  # --workspace --all-features, and core/fuzz is discovered automatically.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f49dff5ddb19b17f69926210abb70f78c14c29e2

  # Repo-specific, so it stays here rather than moving into the shared workflow.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
